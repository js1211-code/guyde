<!--
  앱 아이콘 / 파비콘. Next.js App Router가 app/icon.svg를 자동으로 잡는다.

  타일은 브랜드 브라운, 마크는 크림. 원본 디자인의 "App icon — dark"를
  우리 팔레트로 옮긴 것이다(원본은 중성 검정 + 금색 accent).
  획은 5로 굵게 뒀다 — 파비콘은 16px까지 줄어들어서 3.5로는 사라진다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#2A1C17"/>
  <g fill="none" stroke="#F5EEE6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(50 52) scale(0.72) translate(-50 -50)">
    <circle cx="14" cy="13" r="8"/>
    <circle cx="86" cy="13" r="8"/>
    <path d="M20 18 L50 55"/>
    <path d="M80 18 L50 55"/>
    <circle cx="50" cy="55" r="4" stroke-width="4.5"/>
    <path d="M43 56 L50 92 L57 56"/>
  </g>
</svg>
